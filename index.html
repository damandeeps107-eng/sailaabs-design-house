<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance | Sailaab’s Design House</title>
  
  <!-- Google Fonts: Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #141210;
      color: #F7F4EF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
    }

    .container {
      max-width: 520px;
      width: 100%;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #C5A059;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(197, 160, 89, 0.4);
      margin: 0 auto 28px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 600;
      line-height: 1.25;
      color: #FFFFFF;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 0.92rem;
      color: #9E968D;
      line-height: 1.7;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .contact-link {
      display: inline-block;
      font-size: 0.82rem;
      color: #C5A059;
      text-decoration: none;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(197, 160, 89, 0.35);
      padding-bottom: 3px;
      transition: border-color 0.2s, color 0.2s;
    }

    .contact-link:hover {
      color: #E5C384;
      border-color: #E5C384;
    }

    .footer-note {
      position: absolute;
      bottom: 24px;
      font-size: 0.72rem;
      color: #615B54;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.1rem;
      }
      p {
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-name">Sailaab’s Design House</div>
    <div class="divider"></div>
    
    <h1>Website Under Maintenance</h1>
    <p>We are currently performing scheduled maintenance. We’ll be back online shortly.</p>
    
    <a href="https://wa.me/919219340149" target="_blank" class="contact-link">
      Inquiries: +91 92193 40149
    </a>
  </div>

  <div class="footer-note">Bhadohi · Varanasi</div>

</body>
</html>
