<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This site can’t be reached</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --subtext-color: #5f6368;
      --code-color: #5f6368;
      --blue-color: #1a73e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #202124;
        --text-color: #e8eaed;
        --subtext-color: #9aa0a6;
        --code-color: #9aa0a6;
        --blue-color: #8ab4f8;
      }
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10% 15%;
    }
    @media (max-width: 600px) {
      body {
        padding: 40px 24px;
        justify-content: flex-start;
      }
    }
    .error-container {
      max-width: 600px;
    }
    .icon-wrapper {
      margin-bottom: 24px;
    }
    .sad-icon {
      width: 48px;
      height: 48px;
      fill: #5f6368;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 16px;
      color: var(--text-color);
    }
    p {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--subtext-color);
      margin-bottom: 16px;
    }
    ul {
      margin-left: 20px;
      margin-bottom: 24px;
      color: var(--subtext-color);
      font-size: 0.9375rem;
      line-height: 1.6;
    }
    li {
      margin-bottom: 8px;
    }
    .error-code {
      font-size: 0.8125rem;
      color: var(--code-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 32px;
      font-family: monospace, sans-serif;
    }
    .reload-btn {
      display: inline-block;
      background-color: var(--blue-color);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 16px;
      text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      .reload-btn {
        color: #202124;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="icon-wrapper">
      <svg class="sad-icon" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
    </div>
    <h1>This site can’t be reached</h1>
    <p>The webpage at <strong>https://sailaabsdesignhouse.com</strong> might be temporarily down or it may have moved permanently to a new web address.</p>
    <p>Try:</p>
    <ul>
      <li>Checking the connection</li>
      <li>Checking the proxy and the firewall</li>
    </ul>
    <button class="reload-btn" onclick="location.reload();">Reload</button>
    <div class="error-code">ERR_CONNECTION_REFUSED</div>
  </div>
</body>
</html>
